<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiyohi Kun</title>
    <link rel = "stylesheet" href = "style.css"> 
</head>
<body>
<div class = "container">
    <div class = "app-header">
        <h1>Hiyohi-Kun</h1>
        <p>収入◦支出管理アプリ</p>
    </div>
<div class = "content">
    <div class = "income-section">
        <p class = "section-title">収入</p>
        <input id = "incomeInputName" type = "text" placeholder = "収入の名前">
        <input id = "incomeInputAmount" type = "text" placeholder = "収入の金額">
        <button onClick = "addIncome()"> + 収入を追加</button>
        <ul id = "incomeList"></ul>
    </div> 

    <div class = "expense-section">
        <p class = "section-title">支出</p>
        <input id = "expenseInputName" type = "text" placeholder = "支出の名前">
        <input id = "expenseInputAmount" type = "text" placeholder = "支出の金額">
        <button onClick = "addExpense()"> + 支出を追加</button>
        <ul id = "expenseList"></ul>
    </div>

    <div class = "button-row">
        <button onClick = "calculateIncome()" id = "calculateBtn">計算する</button>
        <button onClick = "resetCalculator()" id = "resetBtn">リセット</button>
    </div>

    <div class = "result-section">
        <p>残り金額</p>
        <h3 id = "remainingAmount">¥ ---</h3>
    </div>
    </div>
</div> 
    <script src = "index.js"></script>
</body>
</html>
